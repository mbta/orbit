name: Deploy Orbit

on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string
      version-name:
        required: true
        type: string
        description: descriptive id of what's deployed (e.g. release name or pr number). doesn't have to be unique, the git hash is appended later
    secrets:
      AWS_ROLE_ARN:
        required: true
      DOCKER_REPO:
        required: true
      SLACK_WEBHOOK:
        required: true

permissions: {}

jobs:
  deploy:
    name: Deploy to ${{ inputs.env }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      id-token: write # allows workflow to exchange short-lived tokens directly from cloud provider
      contents: read
    environment: ${{ inputs.env }}

    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get versions
        id: calc-version
        env:
          VERSION: ${{ inputs.version-name }}
          ENV: ${{ inputs.env }}
          DOCKER_REPO: ${{ secrets.DOCKER_REPO }}
        run: |
          docker_repo="${DOCKER_REPO}"
          git_hash="$(git rev-parse --short HEAD)"
          version_id="${VERSION}-$git_hash"
          git_hash_tag="$docker_repo:git-$git_hash"
          latest_env_tag="$docker_repo:latest-${ENV}"
          version_tag="$docker_repo:$version_id"
          echo "version-id=$version_id" | tee -a $GITHUB_OUTPUT
          echo "deploy-tag=$version_tag" | tee -a $GITHUB_OUTPUT
          printf "tag-list=%s,%s,%s\n" "$git_hash_tag" "$latest_env_tag" "$version_tag" | tee -a $GITHUB_OUTPUT
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          no-cache: true
          # FIXME: Caching is temporarily disabled due to GH issues
          # cache-from: type=gha
          build-args: |
            RELEASE=${{ steps.calc-version.outputs.version-id }}
          tags: ${{ steps.calc-version.outputs.tag-list }}
          push: true
      - uses: mbta/actions/deploy-ecs@788f8e264e9ebb1b76b927c89e6466d5a162be80 # v2.24
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          ecs-cluster: orbit
          ecs-service: orbit-${{ inputs.env }}
          docker-tag: ${{ steps.calc-version.outputs.deploy-tag }}
      - uses: mbta/actions/notify-slack-deploy@788f8e264e9ebb1b76b927c89e6466d5a162be80 # v2.24
        if: ${{ !cancelled() }}
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          job-status: ${{ job.status }}
          custom-message: Deployed ${{ steps.calc-version.outputs.version-id }} to ${{ inputs.env }}
